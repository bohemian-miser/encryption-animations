<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asymmetric Encryption Interactive Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- GitHub Corner Octocat (Top Right) -->
    <a href="https://github.com/bohemian-miser/encryption-animations" class="github-corner z-50" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"/>
        </svg>
    </a>

    <div class="container">
        <h1>Asymmetric Encryption Animation</h1>
        
        <div class="animation-space asymmetric-layout">
            <svg id="diagram-svg" viewBox="0 0 800 340"></svg>
        </div>

        <!-- Asymmetric Math Visualization -->
        <div class="math-panel" id="math-panel">
            <h3>Asymmetric Encryption Process</h3>
            <div class="binary-row">
                <span class="label">Input:</span>
                <span class="value" id="math-input-val">0</span>
                <span class="hex" id="math-input-hex">(00 00)</span>
            </div>
            <div class="binary-row">
                <span class="label">Operation:</span>
                <span class="value" id="math-operation">m^e mod n</span>
            </div>
            <div class="binary-row">
                <span class="label">Output:</span>
                <span class="value" id="math-output-val">0</span>
                <span class="hex" id="math-output-hex">(00 00)</span>
            </div>
            <div class="binary-row" style="margin-top: 10px; font-size: 0.9em; border-top: 1px dashed #ddd; padding-top: 10px;">
                <span class="label" style="width: auto; margin-right: 10px;">Public Key:</span>
                <span class="value" style="color: #666;">(e=17, n=64507)</span>
                <span class="label" style="width: auto; margin-left: 20px; margin-right: 10px;">Private Key:</span>
                <span class="value" style="color: #666;">(d=56473, n=64507)</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="plaintext-input">Plaintext (Hex, max FBF9):</label>
                <input type="text" id="plaintext-input" value="AAAA" maxlength="4">
            </div>
            <div class="control-group" style="display: none;">
                <!-- Hide key input for asymmetric as we use fixed keys -->
                <label for="key-input">Key (Hex):</label>
                <input type="text" id="key-input" value="1111" maxlength="4">
            </div>
            <div class="control-group">
                <button id="btn-encrypt">Run Encryption</button>
                <button id="btn-decrypt">Run Decryption</button>
                <button id="btn-loop">Auto Loop</button>
                <button id="btn-pause" style="display: none; background-color: #dc3545;">Pause</button>
            </div>
            <div class="control-group">
                <label for="speed-input">Animation Speed:</label>
                <input type="range" id="speed-input" min="0.5" max="3" step="0.1" value="1">
                <span id="speed-val">1.0x</span>
            </div>
        </div>
        
        <div class="page-switcher">
            <a href="index.html">Symmetric (XOR/AES)</a>
            <span class="divider">|</span>
            <a href="block.html">Block Ciphers (CBC)</a>
            <span class="divider">|</span>
            <a href="feistel.html">Feistel Round</a>
            <span class="divider">|</span>
            <a href="asymmetric.html" class="active">Asymmetric (RSA)</a>
        </div>
    </div>

    <script type="module" src="asymmetric.js?v=2"></script>
</body>
</html>
