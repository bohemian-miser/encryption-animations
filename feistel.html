<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feistel Round Interactive Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Feistel Round Animation</h1>
        
        <div class="animation-space feistel-layout">
            <!-- Left Column: L0 -> XOR -> L1_XOR -> R1 -->

                <!-- L0 Box -->

                        </g>
                    </svg>
                </div>

                <!-- XOR Gate -->
                <div class="xor-gate" id="xor-gate">
                    <span>+</span>
                </div>

                <!-- L1 Box (bottom left) -->
                <div class="box-container small-box" id="l1-container" style="opacity: 0;">
                    <span class="box-label-bottom">L₁ = R₀</span>
                    <svg class="box-svg" id="box-l1" viewBox="0 0 475.19 112.03">
                        <g id="box-path">
                            <path class="box-outline" d="M473.64,103.31q-6-23.85-9.92-48.07-2.07-13-3.49-26.07c-.56-5.15.43-13.23-3.1-17.66s-13.55-3.73-18.82-4.16c-8.93-.72-17.87-1.21-26.83-1.55-18.3-.7-36.63-.82-54.95-1Q245.78,3.73,135,4.54,76,5,17,5.93c.1-.68.19-1.36.3-2,.36-2.39-3.67-3.43-4-1-.16,1-.3,2.08-.46,3.12L9.62,6a1.9,1.9,0,1,0,0,3.8l2.59,0Q9,32.11,6.38,54.49q-1.48,13-2.73,26.09-.58,6.06-1.1,12.13c-.36,4.11-1.41,8.73-.93,12.82.79,6.65,9.73,4.78,14.92,4.7l29.12-.44,58.24-.88,235-3.56c44.23-.66,88.49-1.2,132.7.37A2,2,0,0,0,473.64,103.31Zm-226.22-.38-224.63,3.4c-4.14.06-13.09,1.73-15.77-1.1S6.57,94.62,6.9,90.84q1.23-14,2.74-28Q12.5,36.26,16.4,9.74,119.59,8.06,222.79,8q53.29,0,106.59.38c35.6.27,71.39-.11,106.88,2.62,4.89.38,12.55-.1,16.34,2.71,3.6,2.67,2.74,8.67,3.16,12.71q1.31,12.66,3.22,25.26,3.81,25.26,10,50.15C395.21,99.34,321.21,101.82,247.42,102.93Z"/>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- Right Column: R0 -> F -> XOR and crossover -->
            <div class="feistel-column right">
                <!-- R0 Box -->
                <div class="box-container small-box" id="r0-container">
                    <span class="box-label-top">R₀</span>
                    <svg class="box-svg" id="box-r0" viewBox="0 0 475.19 112.03">
                        <g id="box-path">
                            <path class="box-outline" d="M473.64,103.31q-6-23.85-9.92-48.07-2.07-13-3.49-26.07c-.56-5.15.43-13.23-3.1-17.66s-13.55-3.73-18.82-4.16c-8.93-.72-17.87-1.21-26.83-1.55-18.3-.7-36.63-.82-54.95-1Q245.78,3.73,135,4.54,76,5,17,5.93c.1-.68.19-1.36.3-2,.36-2.39-3.67-3.43-4-1-.16,1-.3,2.08-.46,3.12L9.62,6a1.9,1.9,0,1,0,0,3.8l2.59,0Q9,32.11,6.38,54.49q-1.48,13-2.73,26.09-.58,6.06-1.1,12.13c-.36,4.11-1.41,8.73-.93,12.82.79,6.65,9.73,4.78,14.92,4.7l29.12-.44,58.24-.88,235-3.56c44.23-.66,88.49-1.2,132.7.37A2,2,0,0,0,473.64,103.31Zm-226.22-.38-224.63,3.4c-4.14.06-13.09,1.73-15.77-1.1S6.57,94.62,6.9,90.84q1.23-14,2.74-28Q12.5,36.26,16.4,9.74,119.59,8.06,222.79,8q53.29,0,106.59.38c35.6.27,71.39-.11,106.88,2.62,4.89.38,12.55-.1,16.34,2.71,3.6,2.67,2.74,8.67,3.16,12.71q1.31,12.66,3.22,25.26,3.81,25.26,10,50.15C395.21,99.34,321.21,101.82,247.42,102.93Z"/>
                        </g>
                    </svg>
                </div>

                <!-- F Block -->
                <div class="f-block" id="f-block">
                    <span>F</span>
                </div>

                <!-- Round Key Node K0 -->
                <div class="key-node" id="key-node">
                    <span class="key-node-label">K₀</span>
                    <span class="key-node-value" id="key-node-val">55</span>
                </div>

                <!-- R1 Box -->
                <div class="box-container small-box" id="r1-container" style="opacity: 0;">
                    <span class="box-label-bottom">R₁ = L₀ ⊕ F(R₀,K₀)</span>
                    <svg class="box-svg" id="box-r1" viewBox="0 0 475.19 112.03">
                        <g id="box-path">
                            <path class="box-outline" d="M473.64,103.31q-6-23.85-9.92-48.07-2.07-13-3.49-26.07c-.56-5.15.43-13.23-3.1-17.66s-13.55-3.73-18.82-4.16c-8.93-.72-17.87-1.21-26.83-1.55-18.3-.7-36.63-.82-54.95-1Q245.78,3.73,135,4.54,76,5,17,5.93c.1-.68.19-1.36.3-2,.36-2.39-3.67-3.43-4-1-.16,1-.3,2.08-.46,3.12L9.62,6a1.9,1.9,0,1,0,0,3.8l2.59,0Q9,32.11,6.38,54.49q-1.48,13-2.73,26.09-.58,6.06-1.1,12.13c-.36,4.11-1.41,8.73-.93,12.82.79,6.65,9.73,4.78,14.92,4.7l29.12-.44,58.24-.88,235-3.56c44.23-.66,88.49-1.2,132.7.37A2,2,0,0,0,473.64,103.31Zm-226.22-.38-224.63,3.4c-4.14.06-13.09,1.73-15.77-1.1S6.57,94.62,6.9,90.84q1.23-14,2.74-28Q12.5,36.26,16.4,9.74,119.59,8.06,222.79,8q53.29,0,106.59.38c35.6.27,71.39-.11,106.88,2.62,4.89.38,12.55-.1,16.34,2.71,3.6,2.67,2.74,8.67,3.16,12.71q1.31,12.66,3.22,25.26,3.81,25.26,10,50.15C395.21,99.34,321.21,101.82,247.42,102.93Z"/>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- Connectors and Arrows -->
            <div class="feistel-arrows">
                <!-- Arrow 1: L0 -> XOR (down) -->
                <svg class="arrow-svg feistel-arrow arrow-l0-xor" viewBox="0 0 152.39 81.26">
                    <path d="M5.77,43.1a1021.29,1021.29,0,0,1,119.12-1.56c7.72.35,7.7-11.65,0-12A1021.29,1021.29,0,0,0,5.77,31.1c-7.66.55-7.72,12.55,0,12Z"/>
                    <path d="M90,11.09A217.37,217.37,0,0,0,145,30.8l-2.65-10a273.17,273.17,0,0,0-31.94,51.35c-3.29,6.94,7,13,10.36,6.06a260.18,260.18,0,0,1,30.06-48.92c2.55-3.25,2.23-9-2.65-10A205.46,205.46,0,0,1,96.1.73C89.25-2.82,83.18,7.54,90,11.09Z"/>
                </svg>

                <!-- Arrow 2: R0 -> F (down) -->
                <svg class="arrow-svg feistel-arrow arrow-r0-f" viewBox="0 0 152.39 81.26">
                    <path d="M5.77,43.1a1021.29,1021.29,0,0,1,119.12-1.56c7.72.35,7.7-11.65,0-12A1021.29,1021.29,0,0,0,5.77,31.1c-7.66.55-7.72,12.55,0,12Z"/>
                    <path d="M90,11.09A217.37,217.37,0,0,0,145,30.8l-2.65-10a273.17,273.17,0,0,0-31.94,51.35c-3.29,6.94,7,13,10.36,6.06a260.18,260.18,0,0,1,30.06-48.92c2.55-3.25,2.23-9-2.65-10A205.46,205.46,0,0,1,96.1.73C89.25-2.82,83.18,7.54,90,11.09Z"/>
                </svg>

                <!-- Arrow 3: K0 -> F (left) -->
                <svg class="arrow-svg feistel-arrow arrow-key-f" viewBox="0 0 152.39 81.26">
                    <path d="M5.77,43.1a1021.29,1021.29,0,0,1,119.12-1.56c7.72.35,7.7-11.65,0-12A1021.29,1021.29,0,0,0,5.77,31.1c-7.66.55-7.72,12.55,0,12Z"/>
                    <path d="M90,11.09A217.37,217.37,0,0,0,145,30.8l-2.65-10a273.17,273.17,0,0,0-31.94,51.35c-3.29,6.94,7,13,10.36,6.06a260.18,260.18,0,0,1,30.06-48.92c2.55-3.25,2.23-9-2.65-10A205.46,205.46,0,0,1,96.1.73C89.25-2.82,83.18,7.54,90,11.09Z"/>
                </svg>

                <!-- Arrow 4: F -> XOR (left) -->
                <svg class="arrow-svg feistel-arrow arrow-f-xor" viewBox="0 0 152.39 81.26">
                    <path d="M5.77,43.1a1021.29,1021.29,0,0,1,119.12-1.56c7.72.35,7.7-11.65,0-12A1021.29,1021.29,0,0,0,5.77,31.1c-7.66.55-7.72,12.55,0,12Z"/>
                    <path d="M90,11.09A217.37,217.37,0,0,0,145,30.8l-2.65-10a273.17,273.17,0,0,0-31.94,51.35c-3.29,6.94,7,13,10.36,6.06a260.18,260.18,0,0,1,30.06-48.92c2.55-3.25,2.23-9-2.65-10A205.46,205.46,0,0,1,96.1.73C89.25-2.82,83.18,7.54,90,11.09Z"/>
                </svg>

                <!-- Arrow 5: XOR -> R1 (diagonal down-right) -->
                <svg class="arrow-svg feistel-arrow arrow-xor-r1" viewBox="0 0 152.39 81.26">
                    <path d="M5.77,43.1a1021.29,1021.29,0,0,1,119.12-1.56c7.72.35,7.7-11.65,0-12A1021.29,1021.29,0,0,0,5.77,31.1c-7.66.55-7.72,12.55,0,12Z"/>
                    <path d="M90,11.09A217.37,217.37,0,0,0,145,30.8l-2.65-10a273.17,273.17,0,0,0-31.94,51.35c-3.29,6.94,7,13,10.36,6.06a260.18,260.18,0,0,1,30.06-48.92c2.55-3.25,2.23-9-2.65-10A205.46,205.46,0,0,1,96.1.73C89.25-2.82,83.18,7.54,90,11.09Z"/>
                </svg>

                <!-- Arrow 6: R0 split -> L1 (diagonal down-left) -->
                <svg class="arrow-svg feistel-arrow arrow-r0-l1" viewBox="0 0 152.39 81.26">
                    <path d="M5.77,43.1a1021.29,1021.29,0,0,1,119.12-1.56c7.72.35,7.7-11.65,0-12A1021.29,1021.29,0,0,0,5.77,31.1c-7.66.55-7.72,12.55,0,12Z"/>
                    <path d="M90,11.09A217.37,217.37,0,0,0,145,30.8l-2.65-10a273.17,273.17,0,0,0-31.94,51.35c-3.29,6.94,7,13,10.36,6.06a260.18,260.18,0,0,1,30.06-48.92c2.55-3.25,2.23-9-2.65-10A205.46,205.46,0,0,1,96.1.73C89.25-2.82,83.18,7.54,90,11.09Z"/>
                </svg>
            </div>
        </div>

        <!-- Feistel Math Visualization -->
        <div class="math-panel" id="math-panel">
            <h3>Feistel Round Process</h3>
            <div class="binary-row">
                <span class="label">Inputs:</span>
                <span class="value">L₀ = <span id="math-l0-val">00</span>, R₀ = <span id="math-r0-val">00</span></span>
            </div>
            <div class="binary-row">
                <span class="label">F Function:</span>
                <span class="value">F(R₀, K₀) = R₀ ⊕ K₀ = <span id="math-r0-expr">00</span> ⊕ <span id="math-k0-expr">00</span> = <span id="math-f-val">00</span></span>
            </div>
            <div class="binary-row">
                <span class="label">XOR:</span>
                <span class="value">R₁ = L₀ ⊕ F(R₀, K₀) = <span id="math-l0-expr">00</span> ⊕ <span id="math-f-expr">00</span> = <span id="math-r1-val">00</span></span>
            </div>
            <div class="binary-row">
                <span class="label">Crossover:</span>
                <span class="value">L₁ = R₀ = <span id="math-l1-val">00</span></span>
            </div>
            <div class="binary-row" style="margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 10px;">
                <span class="label">Output:</span>
                <span class="value" style="font-weight: bold;">L₁R₁ = <span id="math-out-hex">0000</span></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="plaintext-input">Plaintext (Hex, 4 chars):</label>
                <input type="text" id="plaintext-input" value="AAAA" maxlength="4">
            </div>
            <div class="control-group">
                <label for="key-input">Round Key K₀ (Hex, 2 chars):</label>
                <input type="text" id="key-input" value="55" maxlength="2">
            </div>
            <div class="control-group">
                <button id="btn-encrypt">Run Encryption</button>
                <button id="btn-decrypt">Run Decryption</button>
                <button id="btn-loop">Auto Loop</button>
                <button id="btn-pause" style="display: none; background-color: #dc3545;">Pause</button>
            </div>
            <div class="control-group">
                <label for="speed-input">Animation Speed:</label>
                <input type="range" id="speed-input" min="0.5" max="3" step="0.1" value="1">
                <span id="speed-val">1.0x</span>
            </div>
        </div>
        
        <div style="margin-top: 20px; text-align: center; font-weight: bold;">
            <a href="index.html" style="color: #007bff; text-decoration: none;">&larr; Symmetric (AES)</a>
            <span style="color: #ccc; margin: 0 10px;">|</span>
            <a href="asymmetric.html" style="color: #007bff; text-decoration: none;">Asymmetric (RSA) &rarr;</a>
        </div>
    </div>

    <script type="module" src="feistel.js"></script>
</body>
</html>
